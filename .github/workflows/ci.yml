name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Guard against committed auth placeholders
        run: |
          ! rg -n "dev-session-secret-change-me|localdev123" \
            .vscode/tasks.json backend/.env.local.example README.md

      - name: Run backend tests
        env:
          AUTH_ENABLED: "0"
          ENABLE_SCRAPING: "0"
        run: |
          cd backend
          pytest

  frontend-build-and-test:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test:run

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  llm-tracing-validation-placeholder:
    name: LLM tracing validation placeholder
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Emit placeholder evidence
        run: |
          mkdir -p artifacts/llm-tracing
          {
            echo "LLM tracing validation placeholder"
            echo "Tickets: 019 (decision), 020 (implementation)"
            echo "Status: pending implementation"
            echo "Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/llm-tracing/placeholder.txt

      - name: Upload placeholder artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-tracing-placeholder
          path: artifacts/llm-tracing
          if-no-files-found: error
